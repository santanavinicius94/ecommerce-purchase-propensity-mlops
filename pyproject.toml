[project]
name = "ecommerce-purchase-propensity-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "João Faccin" },
    { name = "Vinícius Santana" }
]
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "ipykernel>=7.4.0",
    "mlflow>=3.17.2",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
ecommerce-purchase-propensity-mlops = "ecommerce_purchase_propensity_mlops:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP",]

ignore = ["E501",]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

vars:
  - params.yaml

stages:
  prepare:
    cmd: uv run python scripts/prepare_data.py --config params.yaml
    deps:
      - scripts/common.py
      - scripts/prepare_data.py
      - src/ecommerce_purchase_propensity_mlops/preprocessing.py
      - data/raw/online_shoppers_intention.csv
      - pyproject.toml
      - uv.lock
    params:
      - params.yaml:
          - paths.raw_data
          - paths.split_data
          - split
    outs:
      - ${paths.split_data}

  train:
    cmd: uv run python scripts/train.py --config params.yaml
    deps:
      - scripts/common.py
      - scripts/train.py
      - src/ecommerce_purchase_propensity_mlops/preprocessing.py
      - src/ecommerce_purchase_propensity_mlops/training.py
      - ${paths.split_data}
      - pyproject.toml
      - uv.lock
    params:
      - params.yaml:
          - paths.model
          - paths.mlflow_run
          - model
          - features
          - split
          - mlflow
    outs:
      - ${paths.model}
      - ${paths.mlflow_run}:
          cache: false

  evaluate:
    cmd: uv run python scripts/evaluate.py --config params.yaml
    deps:
      - scripts/common.py
      - scripts/evaluate.py
      - src/ecommerce_purchase_propensity_mlops/training.py
      - ${paths.split_data}
      - ${paths.model}
      - ${paths.mlflow_run}
      - pyproject.toml
      - uv.lock
    params:
      - params.yaml:
          - paths.metrics
          - model.name
          - mlflow
    metrics:
      - ${paths.metrics}
